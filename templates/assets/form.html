{% extends "base.html" %}
{% block title %}New asset{% endblock %}
{% block content %}
<h1>New asset · {{ eng.code }}</h1>
<p class="muted">Pick a type and name it. You'll add type-specific details, functions, services, credentials and a walkthrough next.</p>
<form method="post" class="stack card">{% csrf_token %}{{ form.as_p }}
  <div class="row-gap"><button class="primary">Create</button>
    <a href="{% url 'assets:list' code=eng.code %}" class="btn-sm">Cancel</a></div>
</form>
{% endblock %}
